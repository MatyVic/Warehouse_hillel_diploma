name: Django CI/CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (flake8 + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install lint tools
        run: pip install flake8 black

      - name: Run flake8
        run: flake8 . --max-line-length=100 --exclude=venv,migrations,staticfiles

      - name: Run black (check only)
        run: black --check --diff .

  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: db
          POSTGRES_USER: my_user
          POSTGRES_PASSWORD: my_secretpass_word
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U my_user -d db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: warehouse_hillel_diploma.settings.development
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DB_NAME: db
      DB_USER: my_user
      DB_PASSWORD: my_secretpass_word
      DB_HOST: localhost
      DB_PORT: 5433
      REDIS_HOST: localhost
      REDIS_PORT: 6380
      CELERY_BROKER_URL: redis://localhost:6380/0
      SHOP_SERVICE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        run: |
          python -m pytest -o python_files="tests.py test_*.py" \
            --cov=warehouse --cov=warehouse_api --cov=user_management \
            --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    name: Build & push Docker image
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    # Перенесли сюда: теперь secrets доступен!
    env:
      DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/warehouse-hillel-diploma

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max